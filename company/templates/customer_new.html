<!DOCTYPE html>

<html>
<head>
    <title>Add Customer</title>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }

    body{
        background:#f4f7fc;
    }

    .container{
        max-width:700px;
        margin:40px auto;
        padding:20px;
    }

    .card{
        background:white;
        padding:30px;
        border-radius:15px;
        box-shadow:0 5px 20px rgba(0,0,0,0.08);
    }

    h1{
        text-align:center;
        margin-bottom:25px;
        color:#1e293b;
    }

    .form-group{
        margin-bottom:18px;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-weight:bold;
        color:#334155;
    }

    input,
    textarea{
        width:100%;
        padding:12px;
        border:1px solid #d1d5db;
        border-radius:8px;
        font-size:15px;
    }

    input:focus,
    textarea:focus{
        outline:none;
        border-color:#2563eb;
    }

    textarea{
        resize:vertical;
        min-height:100px;
    }

    .btn-group{
        display:flex;
        gap:10px;
        margin-top:20px;
    }

    .btn{
        text-decoration:none;
        border:none;
        padding:12px 20px;
        border-radius:8px;
        cursor:pointer;
        font-size:15px;
    }

    .btn-primary{
        background:#2563eb;
        color:white;
    }

    .btn-primary:hover{
        background:#1d4ed8;
    }

    .btn-secondary{
        background:#e2e8f0;
        color:#334155;
    }

    .btn-secondary:hover{
        background:#cbd5e1;
    }

    @media(max-width:768px){
        .btn-group{
            flex-direction:column;
        }
    }
</style>

</head>

<body>

<div class="container">

<div class="card">

    <h1>Add Customer</h1>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>First Name</label>
            <input type="text" name="first_name" required>
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input type="text" name="last_name" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" required>
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea name="address" required></textarea>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary">
                Save Customer
            </button>

            <a href="/customers/" class="btn btn-secondary">
                Cancel
            </a>
        </div>

    </form>

</div>


</div>

</body>
</html>
