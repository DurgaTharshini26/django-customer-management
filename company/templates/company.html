<!DOCTYPE html>
<html>
<head>
    <title>Company Dashboard</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f7fc;
        }

        .container{
            max-width:1200px;
            margin:auto;
            padding:40px 20px;
        }

        .hero{
            background:white;
            padding:50px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 5px 20px rgba(0,0,0,0.08);
        }

        .hero h1{
            color:#1e293b;
            margin-bottom:15px;
        }

        .hero p{
            color:#64748b;
            margin-bottom:25px;
        }

        .btn{
            display:inline-block;
            text-decoration:none;
            background:#2563eb;
            color:white;
            padding:12px 25px;
            border-radius:8px;
            transition:.3s;
        }

        .btn:hover{
            background:#1d4ed8;
        }
    </style>

</head>
<body>

<div class="container">

    <div class="hero">
        <h1>Company Dashboard</h1>

        <p>
            Welcome to the Customer Management System
        </p>

        <a href="/customers/" class="btn">
            View Customers
        </a>
    </div>

</div>
 
</body>
</html>
